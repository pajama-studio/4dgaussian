[package]
name = "pajama-gaussian-lab"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "An evidence-driven temporal Gaussian renderer prototype in Rust and wgpu"
repository = "https://github.com/pajama-studio/4dgaussian"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
console_error_panic_hook = "0.1"
glam = "0.32"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
web-time = "1.1"
wgpu = "30"

[dev-dependencies]
pollster = "0.4"
flate2 = "1"
serde_json = "1"
png = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
